[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft_rca"
version = "0.1.0"
description = "Explainable On-Board Spacecraft Anomaly & Root-Cause Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "safetensors>=0.4.2",
    "scikit-learn>=1.4.1",
    "joblib>=1.3.2",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
